brand:
  name: AmazonHelp
  twitter_handle: '@AmazonHelp'
  description: Amazon Customer Support on Twitter
data:
  raw_path: data/raw/twcs.csv
  interim_dir: data/interim
  processed_dir: data/processed
  golden_set_path: data/golden/golden_set.csv
  conversation_split:
    train: 0.7
    val: 0.15
    test: 0.15
    seed: 42
intent:
  taxonomy_path: artifacts/intent_taxonomy.yaml
  num_intents: 10
  confidence_threshold: 0.65
retrieval:
  top_k: 3
  similarity_threshold: 0.6
  hybrid_alpha: 0.5
  index_dir: artifacts/retrieval_index
generation:
  provider: LOCAL
  model: deterministic-grounded-v1
  max_tokens: 250
  temperature: 0.0
policy:
  auto_handle_threshold: 0.65
  evidence_similarity_threshold: 0.6
  strict_grounding: true
  risk_keywords:
  - lawsuit
  - attorney
  - lawyer
  - legal action
  - court
  - sue
  - police
  - consumer court
  - bbb
  - fraud
  - scam
  - stolen card
  - unauthorized charge
  - chargeback
