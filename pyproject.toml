[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trustdesk-ai"
version = "1.0.0"
description = "Evidence-Grounded Customer Support Agent (Hiver SDE Intern Evaluation)"
authors = [{ name = "Kathirvel", email = "198301295+Kathirvel005@users.noreply.github.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "pyyaml>=6.0.1",
    "rank-bm25>=0.2.2",
    "requests>=2.32.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "python-dateutil>=2.9.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
