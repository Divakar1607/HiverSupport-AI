version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=LOCAL
      - BRAND_NAME=AmazonHelp
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
      - ./reports:/app/reports
      - ./artifacts:/app/artifacts

  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
